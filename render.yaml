# Blueprint de Render para el backend de $Aldo.
# En Render: New > Blueprint > elegí este repo. Te va a pedir los valores marcados con sync: false.
services:
  - type: web
    name: aldo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Las migraciones corren solas al arrancar (lifespan de main.py).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ALDO_DATABASE_URL
        sync: false # connection string de Neon: postgresql://...?sslmode=require
      - key: ALDO_CORS_ORIGINS
        sync: false # URL del frontend en Vercel, ej. https://aldo.vercel.app
      - key: ALDO_API_KEY
        generateValue: true # la clave que vas a cargar en la app; la ves en Environment
