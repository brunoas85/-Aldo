# Blueprint de Render para el backend de Mango.
# En Render: New > Blueprint > elegí este repo. Te va a pedir los valores marcados con sync: false.
services:
  - type: web
    name: mango-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Las migraciones corren solas al arrancar (lifespan de main.py).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: MANGO_DATABASE_URL
        sync: false # connection string de Neon: postgresql://...?sslmode=require
      - key: MANGO_CORS_ORIGINS
        sync: false # URL del frontend en Vercel: https://tu-mango.vercel.app (separadas por coma si hay varias)
      - key: MANGO_EMAIL_USUARIO_INICIAL
        sync: false # email que, al registrarse, se queda con los datos de antes del login
      - key: MANGO_SECRET
        generateValue: true # firma las sesiones; si cambia, todos tienen que volver a entrar
