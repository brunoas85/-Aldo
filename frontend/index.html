<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mango</title>
    <script>
      // Aplica el tema antes de pintar (misma lógica que src/useTema.js)
      try {
        const t = localStorage.getItem('mango-tema')
        const oscuro = t ? t === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (oscuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
